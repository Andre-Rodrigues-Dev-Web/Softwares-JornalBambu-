<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEIC Ultra Converter</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="container">
        <header>
            <h1>HEIC Converter <span class="badge">Pro</span></h1>
            <p>Transforme suas fotos em assets web de alta performance.</p>
        </header>

        <main class="glass-card">
            <form id="converterForm">
                <div class="input-group">
                    <label for="folderPath">Caminho da Pasta (Source)</label>
                    <input type="text" id="folderPath" placeholder="C:\Users\Fotos\Viagem" required>
                    <button type="button" id="scanBtn" class="secondary-btn">Escanear Pasta</button>
                </div>

                <div class="scan-stats" id="scanStats" style="display: none;">
                    <span id="fileCount">0</span> arquivos .HEIC encontrados
                </div>

                <div class="settings-grid">
                    <div class="input-group">
                        <label>Formato de Saída</label>
                        <div class="radio-group">
                            <label class="radio-card selected">
                                <input type="radio" name="format" value="jpeg" checked>
                                <span>JPEG (Web)</span>
                            </label>
                            <label class="radio-card">
                                <input type="radio" name="format" value="png">
                                <span>PNG (Lossless)</span>
                            </label>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="quality">Qualidade (Otimização Web)</label>
                        <div class="range-wrapper">
                            <input type="range" id="quality" min="10" max="100" value="80">
                            <span id="qualityValue">80%</span>
                        </div>
                    </div>
                </div>

                <button type="submit" id="convertBtn" class="primary-btn" disabled>
                    <span class="btn-text">Iniciar Conversão</span>
                    <div class="spinner"></div>
                </button>
            </form>

            <div id="progressArea" class="progress-area" style="display: none;">
                <div class="progress-header">
                    <span>Convertendo...</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-bar-track">
                    <div class="progress-bar-fill" id="progressBar"></div>
                </div>
                <p id="progressStatus">Aguardando início...</p>
                <div id="progressLogs" class="progress-logs">
                    <!-- Dynamic file items will appear here -->
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
